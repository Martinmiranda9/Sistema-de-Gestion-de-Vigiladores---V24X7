<p-toast></p-toast>

<div class="add-guard-page">
  <!-- Breadcrumb -->
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" styleClass="custom-breadcrumb"></p-breadcrumb>

  <!-- Page Header -->
  <div class="form-header">
    <div class="header-left">
      <div class="header-icon">
        <i class="pi pi-user-plus"></i>
      </div>
      <div>
        <h1 class="page-title">Nuevo Vigilador</h1>
        <p class="page-subtitle">Completá los datos para registrar un nuevo vigilador en el sistema</p>
      </div>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <div class="card-section">
      <div class="section-label">
        <i class="pi pi-id-card"></i>
        <span>Datos personales</span>
      </div>

      <div class="form-grid">
        <!-- Nombre -->
        <div class="form-group">
          <label for="firstName">Nombre <span class="required">*</span></label>
          <input
            pInputText
            id="firstName"
            [(ngModel)]="formData.firstName"
            placeholder="Ej: Martín"
            class="w-full"
            [class.ng-invalid]="!formData.firstName.trim()"
          />
        </div>

        <!-- Apellido -->
        <div class="form-group">
          <label for="lastName">Apellido <span class="required">*</span></label>
          <input
            pInputText
            id="lastName"
            [(ngModel)]="formData.lastName"
            placeholder="Ej: Miranda"
            class="w-full"
            [class.ng-invalid]="!formData.lastName.trim()"
          />
        </div>

        <!-- DNI -->
        <div class="form-group">
          <label for="dni">DNI <span class="required">*</span></label>
          <input
            pInputText
            id="dni"
            [(ngModel)]="formData.dni"
            placeholder="Ej: 43692866"
            class="w-full"
            [class.ng-invalid]="!formData.dni.trim()"
          />
        </div>
      </div>
    </div>

    <p-divider></p-divider>

    <div class="card-section">
      <div class="section-label">
        <i class="pi pi-briefcase"></i>
        <span>Información laboral</span>
      </div>

      <div class="form-grid">
        <!-- Legajo -->
        <div class="form-group">
          <label for="fileNumber">Nro. de Legajo</label>
          <input
            pInputText
            id="fileNumber"
            [(ngModel)]="formData.fileNumber"
            placeholder="Ej: L-001"
            class="w-full"
          />
        </div>

        <!-- Objetivo -->
        <div class="form-group">
          <label for="workplace">Objetivo (Lugar de trabajo)</label>
          <select
            id="workplace"
            [(ngModel)]="formData.workplaceId"
            class="native-select"
          >
            <option [ngValue]="null">Seleccioná un objetivo</option>
            <option *ngFor="let wp of workplaceOptions" [ngValue]="wp.value">{{ wp.label }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Info note -->
    <div class="info-note">
      <i class="pi pi-info-circle"></i>
      <span>El vigilador se registrará con estado <strong>Activo</strong> por defecto. Podés cambiarlo después desde la lista de vigiladores.</span>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        class="p-button-text btn-cancel"
        (click)="cancel()"
        [disabled]="saving"
      ></button>
      <button
        pButton
        label="Registrar Vigilador"
        icon="pi pi-check"
        class="btn-primary"
        (click)="saveGuard()"
        [disabled]="!isFormValid || saving"
        [loading]="saving"
      ></button>
    </div>
  </div>
</div>
