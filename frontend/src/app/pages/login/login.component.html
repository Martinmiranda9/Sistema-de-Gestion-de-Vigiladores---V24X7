<p-toast position="top-right" />

<div class="login-wrapper">
  <div class="login-left">
    <div class="login-form-container">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
          <circle cx="32" cy="32" r="30" fill="none" stroke="#0f172a" stroke-width="3" />
          <path d="M16 22 C20 18, 44 18, 48 22" stroke="#0f172a" stroke-width="2.5" fill="none"
            stroke-linecap="round" />
          <path d="M14 30 C20 26, 44 26, 50 30" stroke="#0f172a" stroke-width="2.5" fill="none"
            stroke-linecap="round" />
          <path d="M16 38 C20 34, 44 34, 48 38" stroke="#0f172a" stroke-width="2.5" fill="none"
            stroke-linecap="round" />
          <path d="M18 46 C22 42, 42 42, 46 46" stroke="#0f172a" stroke-width="2.5" fill="none"
            stroke-linecap="round" />
        </svg>
      </div>

      <h1 class="login-title"> Sistema de Gestión de Vigiladores - Vigil 24x7 SAS</h1>
      <p class="login-subtitle">
        ¿No tenés usuario?
        <a href="#" class="login-link">¡Creá uno!</a>
      </p>

      <form (ngSubmit)="onLogin()" class="login-form">
        <div class="field">
          <label for="username" class="field-label">Usuario</label>
          <input id="username" type="text" pInputText [(ngModel)]="username" name="username"
            placeholder="Nombre de usuario" class="w-full" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password" class="field-label">Contraseña</label>
          <p-password id="password" [(ngModel)]="password" name="password" placeholder="Contraseña" [toggleMask]="true"
            [feedback]="false" styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password" />
        </div>

        <div class="login-options">
          <div class="remember-me">
            <p-checkbox [(ngModel)]="rememberMe" name="rememberMe" [binary]="true" inputId="rememberMe" />
            <label for="rememberMe" class="remember-label">Recordarme</label>
          </div>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <p-button type="submit" label="Iniciar Sesión" icon="pi pi-sign-in" [loading]="loading"
          styleClass="login-btn w-full" />
      </form>
    </div>
  </div>

  <div class="login-right">
    <img src="vigillogin.jpg" alt="Vigilador de Seguridad" class="login-bg-image" />
  </div>
</div>
