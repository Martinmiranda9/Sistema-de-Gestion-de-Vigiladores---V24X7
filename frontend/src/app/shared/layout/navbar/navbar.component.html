<header class="navbar" [style.left]="sidebarCollapsed ? '72px' : '260px'">
  <div class="navbar-left">
    <!-- Mobile toggle -->
    <button class="mobile-toggle" (click)="toggleSidebar.emit()" pRipple>
      <i class="pi pi-bars"></i>
    </button>

    <!-- Breadcrumb / Page title -->
    <div class="navbar-breadcrumb">
      <span class="breadcrumb-icon"><i class="pi pi-home"></i></span>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-current">Dashboard</span>
    </div>
  </div>

  <div class="navbar-right">
    <!-- Search -->
    <div class="navbar-search" [class.active]="searchActive">
      <button class="icon-btn" (click)="toggleSearch()" pRipple>
        <i class="pi pi-search"></i>
      </button>
      <input
        *ngIf="searchActive"
        type="text"
        pInputText
        placeholder="Buscar..."
        class="search-input"
      />
    </div>

    <!-- Notifications -->
    <button class="icon-btn" pRipple pBadge value="3" severity="danger">
      <i class="pi pi-bell"></i>
    </button>

    <!-- Messages -->
    <button class="icon-btn" pRipple>
      <i class="pi pi-envelope"></i>
    </button>

    <!-- Divider -->
    <div class="navbar-divider"></div>

    <!-- User Profile -->
    <div class="user-profile">
      <p-avatar
        icon="pi pi-user"
        shape="circle"
        [style]="{ 'background-color': '#2563eb', color: '#ffffff', 'font-size': '0.85rem' }"
      />
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
      <i class="pi pi-chevron-down user-chevron"></i>
    </div>
  </div>
</header>
