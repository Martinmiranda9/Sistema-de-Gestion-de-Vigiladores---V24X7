<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="sidebar-brand" routerLink="/dashboard">
      <div class="brand-logo">
        <img src="logo.jpg" alt="Logo Vigil 24x7" class="brand-logo-img" />
      </div>
      <div class="brand-text" *ngIf="!collapsed">
        <span class="brand-name">Vigil 24×7</span>
        <span class="brand-sub">SAS</span>
      </div>
    </div>

    <button class="collapse-btn" (click)="toggleCollapse()" pRipple>
      <i class="pi" [ngClass]="collapsed ? 'pi-angle-right' : 'pi-angle-left'"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section" *ngFor="let section of menuSections">
      <span class="nav-section-title" *ngIf="!collapsed">{{ section.title }}</span>
      <div class="nav-section-divider" *ngIf="collapsed"></div>

      <a
        *ngFor="let item of section.items"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        [pTooltip]="collapsed ? item.label : ''"
        tooltipPosition="right"
        pRipple
      >
        <div class="nav-icon">
          <i [class]="item.icon"></i>
        </div>
        <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <a class="nav-item" routerLink="/settings" routerLinkActive="active" pRipple
       [pTooltip]="collapsed ? 'Configuración' : ''" tooltipPosition="right">
      <div class="nav-icon"><i class="pi pi-cog"></i></div>
      <span class="nav-label" *ngIf="!collapsed">Configuración</span>
    </a>
    <a class="nav-item logout-item" (click)="$event.preventDefault()" pRipple
       [pTooltip]="collapsed ? 'Cerrar Sesión' : ''" tooltipPosition="right">
      <div class="nav-icon"><i class="pi pi-sign-out"></i></div>
      <span class="nav-label" *ngIf="!collapsed">Cerrar Sesión</span>
    </a>
  </div>
</aside>
